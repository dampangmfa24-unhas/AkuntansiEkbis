<script>
/* =====================================================================
   GAME — state & util
   ===================================================================== */
var G = { hub: null, screen: 'hub', run: null, qi: 0, hasil: [], lbTab: 'minggu' };
var G_PAL = ['#F94144', '#F3722C', '#F8961E', '#F9844A', '#F9C74F', '#90BE6D', '#43AA8B', '#4D908E', '#577590', '#277DA1'];
var AKUN_GRUP = { '1': 'Aset', '2': 'Utang', '3': 'Modal', '4': 'Pendapatan', '5': 'Beban' };

function gcall(aksi, d) { return call('game', Object.assign({ aksi: aksi }, d || {})); }
function gm(html) { view('<div class="gm">' + html + '</div>'); if (typeof kjPaint === 'function') kjPaint(document.getElementById('view')); }
function gload(t) { gm('<div class="loading">' + esc(t || 'Memuat…') + '</div>'); }
function rpn(n) { n = Number(n) || 0; return (n < 0 ? '−' : '') + 'Rp' + fmt(Math.abs(n)); }

/* ---------- suara & getar ---------- */
var G_AC = null;
function soundOn() { return load('akt_sound') !== 'off'; }
function beep(seq) {
  if (!soundOn()) return;
  try {
    G_AC = G_AC || new (window.AudioContext || window.webkitAudioContext)();
    var t = G_AC.currentTime;
    seq.forEach(function (n) {
      var o = G_AC.createOscillator(), g = G_AC.createGain();
      o.type = n[3] || 'triangle'; o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, t + n[1]); g.gain.exponentialRampToValueAtTime(0.18, t + n[1] + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + n[1] + n[2]);
      o.connect(g); g.connect(G_AC.destination); o.start(t + n[1]); o.stop(t + n[1] + n[2] + 0.05);
    });
  } catch (e) { }
}
function buzz(p) { if (soundOn() && navigator.vibrate) try { navigator.vibrate(p); } catch (e) { } }
var SFX = {
  ok: function () { beep([[660, 0, .12], [990, .1, .2]]); buzz(25); },
  no: function () { beep([[220, 0, .18, 'sawtooth'], [180, .12, .2, 'sawtooth']]); buzz([50, 40, 50]); },
  coin: function () { beep([[1200, 0, .08, 'square'], [1600, .07, .12, 'square']]); },
  win: function () { beep([[523, 0, .14], [659, .12, .14], [784, .24, .14], [1047, .36, .3]]); buzz([30, 30, 60]); }
};
function confetti() {
  for (var i = 0; i < 46; i++) {
    var c = document.createElement('i'); c.className = 'confetti';
    c.style.left = (Math.random() * 100) + 'vw'; c.style.background = G_PAL[i % G_PAL.length];
    c.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px'); c.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    c.style.animationDelay = (Math.random() * .35) + 's';
    document.body.appendChild(c); setTimeout(function (el) { el.remove(); }.bind(null, c), 2200);
  }
}

/* ---------- kriptografi (cocok dengan server) ---------- */
function utf8(s) { return new TextEncoder().encode(s); }
function hexOf(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
function sha(s) { return crypto.subtle.digest('SHA-256', utf8(s)); }
function shaHex(s) { return sha(s).then(hexOf); }
function canon(q, ans) {
  if (q.tipe === 'pg') return 'pg:' + Number(ans);
  if (q.tipe === 'angka') return 'n:' + Math.round(Number(ans));
  var m = {};
  (ans || []).forEach(function (l) { var k = String(l[0]), s = l[1] === 'K' ? 'K' : 'D', a = Math.round(Number(l[2]) || 0); if (!k || !a) return; m[k + ':' + s] = (m[k + ':' + s] || 0) + a; });
  return Object.keys(m).sort().map(function (k) { return k + ':' + m[k]; }).join(';');
}
function unseal(b64, keyHex) {
  var bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  var blocks = Math.ceil(bytes.length / 32), ps = [];
  for (var b = 0; b < blocks; b++) ps.push(sha(keyHex + ':' + b));
  return Promise.all(ps).then(function (ks) {
    for (var i = 0; i < bytes.length; i++) bytes[i] ^= new Uint8Array(ks[Math.floor(i / 32)])[i % 32];
    return new TextDecoder().decode(bytes);
  });
}
function bukaPanduan(id) {
  loadGuide().then(function (g) {
    var a = g.byId[id]; if (!a) return toast('Topik panduan tidak ditemukan.', 'err');
    openSheet(a.judul, '<div class="guide">' + a.html + '</div>', function (body, close) { initGuide(body, function (gid) { close(); bukaPanduan(gid); }); });
  }).catch(function (e) { toast(e.message, 'err'); });
}

/* =====================================================================
   HUB
   ===================================================================== */
function pGame() {
  document.body.classList.add('gamemode');
  kjAudio();
  gload('Membuka kedai…');
  gcall('hub').then(function (h) { G.hub = h; if (S.page !== 'game') return; kjInit(h); kjStart(); }).catch(failView);
}
function drawHub() {
  document.body.classList.add('gamemode');
  kjMusic('level');
  var h = G.hub, p = h.profil, k = h.kampanye;
  var bintang = h.levels.reduce(function (t, l) { return t + l.bintang; }, 0);
  var html = '<div class="playhead" style="margin-bottom:4px"><button class="xbtn" id="gmMenu" aria-label="Kembali ke menu">‹</button><b style="flex:1;font-size:15px;color:var(--label-2)">Menu</b></div><div class="top"><div class="ava" style="background:#9AD1E8;overflow:hidden;align-items:end">' + kjAva(p.avatar, 46) + '</div><div class="who"><b>' + esc(p.kedai) + '</b><span>' + esc(h.user.nama) + ' · akurasi ' + p.akurasi + '%</span></div>' +
    '<span class="pill coin">🪙 ' + fmt(p.koin) + '</span><span class="pill fire">🔥 ' + (p.harian.streak || 0) + '</span></div>';
  html += kjSceneHtml('hub');

    { p: 2, b: 0, t: 'Semester 5, sebentar lagi lulus. Teman-temanmu sudah jualan dan laris. Kamu pun memutuskan: buka usaha, sekarang juga!', m: 'menu' },

  var draw = function () {
